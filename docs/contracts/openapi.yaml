      x-required-scope: profiles.write
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mien_session
    ticketAuth:
      type: apiKey
      in: query
      name: ticket
      description: 短时、单次使用的 WebSocket 握手票据。
    bearerAuth:
      type: http
      scheme: bearer
      description: 现有 API Token；http bearer 的 requirement 数组为空，x-required-scope 声明权限并由 CI 对照 TokenScope 校验。不引入 OAuth2 或 Token exchange。
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ProfileId:
      name: profile_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    TagId:
      name: tag_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    ProxyId:
      name: proxy_id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: 服务端 Cookie 会话写操作必需；Bearer Token 请求不需要
      schema:
        type: string
  responses:
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Conflict:
      description: 状态冲突或幂等键冲突
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    ValidationError:
      description: 输入校验失败
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: 权限或 scope 不足
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    InternalError:
      description: 内部错误
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    PurgeFailed:
      description: 永久删除的目录移除失败；档案仍为 deleted，可重试
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/PurgeFailure"
    Unavailable:
      description: 依赖或资源暂不可用
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    TooManyRequests:
      description: 登录或请求限流
      headers:
        Retry-After:
          description: 建议等待秒数
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Readiness:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
        checks:
          type: object
          additionalProperties:
            type: object
            required:
            - ok
            properties:
              ok:
                type: boolean
              detail:
                type: string
    LoginInput:
      type: object
      required:
      - password
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    PasswordChangeInput:
      type: object
      required:
      - current_password
      - new_password
      additionalProperties: false
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        new_password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
    Session:
      type: object
      required:
      - authenticated
      - csrf_token
      - must_change_password
      properties:
        authenticated:
          type: boolean
        csrf_token:
          type: string
          description: 会话 CSRF Token，可返回给同源 UI
        must_change_password:
          type: boolean
        user:
          type: string
    Error:
      type: object
      required:
      - code
      - message
      - request_id
      - retryable
      properties:
        code:
          "$ref": "#/components/schemas/ErrorCode"
        message:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
          description: 非敏感字段级错误或诊断信息
    DeletionError:
      type: string
      enum:
      - busy
      - permission_denied
      - io_error
      - not_found
      - unknown
    PurgeFailure:
      allOf:
      - "$ref": "#/components/schemas/Error"
      - type: object
        required:
        - code
        - deletion_error
        properties:
          code:
            const: PROFILE_PURGE_FAILED
          deletion_error:
            "$ref": "#/components/schemas/DeletionError"
    RuntimeState:
      type: string
      enum:
      - stopped
      - starting
      - running
      - stopping
      - crashed
      - failed
    RuntimeMode:
      type: string
      enum:
      - headful
      - headless
      - pseudo_headful
    ProfileStatus:
      type: string
      enum:
      - active
      - archived
      - deleted
    ProxyKind:
      type: string
      enum:
      - http
      - https
      - socks5
      - vless
      - vmess
      - shadowsocks
      - trojan
      - hysteria2
      - wireguard
    Fingerprint:
      "$ref": "./fingerprint-spec.schema.json"
    Profile:
      type: object
      required:
      - id
      - name
      - status
      - mode
      - created_at
      - updated_at
      - fingerprint
      - kernel_version
      - isolation
      - direct
      - reduced_assurance
      - limitations
      properties:
        id:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        name:
          type: string
          maxLength: 120
        group_id:
          type:
          - string
          - 'null'
        tags:
          type: array
          items:
            type: string
            maxLength: 64
          uniqueItems: true
        notes:
          type:
          - string
          - 'null'
        fingerprint:
          "$ref": "#/components/schemas/Fingerprint"
        kernel_version:
          type: string
        proxy_id:
          type:
          - string
          - 'null'
          description: null 表示直连模式；响应同时返回 direct=true。
        mode:
          "$ref": "#/components/schemas/RuntimeMode"
        status:
          "$ref": "#/components/schemas/ProfileStatus"
        runtime:
          "$ref": "#/components/schemas/Runtime"
        start_url:
          type:
          - string
          - 'null'
          pattern: "^(https?://|about:)"
        automation_api:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        deletion_error:
          anyOf:
          - "$ref": "#/components/schemas/DeletionError"
          - type: 'null'
          description: 稳定、非敏感的 purge 失败原因；deleted 行保留以供重试。
        isolation:
          "$ref": "#/components/schemas/Isolation"
        direct:
          type: boolean
          description: 该档案未配置代理并进入直连模式；为 true 时必须同时返回 reduced_assurance=true。
