---
openapi: 3.1.0
info:
  title: Mien Control API
  version: 1.0.0
  description: |-
    Mien 控制面契约。服务器端使用 HTTP/WebSocket；桌面端通过 Tauri IPC 镜像同一组命令语义。
    该文件是 `docs/specs/control-api/SPEC.md` 的机器可读投影；不包含任何密钥、Cookie 值或代理凭据。

    认证保持 Cookie 会话或 Bearer API Token；http bearer 的 requirement 数组为空，授权范围由 x-required-scope 表达并由 CI 与 TokenScope 对照校验。错误优先级：401 认证 -> 403 scope/CSRF/强制改密 -> 授权后的 404。
servers:
- url: "/"
security:
- cookieAuth: []
- bearerAuth: []
tags:
- name: health
- name: auth
- name: profiles
- name: groups
- name: tags
- name: proxies
- name: kernels
- name: engines
- name: tokens
- name: audit
- name: events
- name: contract
paths:
  "/api/v1":
    get:
      tags:
      - contract
      operationId: apiVersion
      security: []
      responses:
        '200':
          description: 当前 API 版本和弃用窗口
          content:
            application/json:
              schema:
                type: object
                required:
                - version
                - deprecation_window_days
                properties:
                  version:
                    const: v1
                  deprecation_window_days:
                    type: integer
                    minimum: 90
  "/healthz":
    get:
      tags:
      - health
      operationId: healthz
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    const: ok
  "/readyz":
    get:
      tags:
      - health
      operationId: readyz
      security: []
      responses:
        '200':
          description: 数据库、内核、共享引擎与当前运行模式所需显示环境就绪；纯 headless 部署不要求显示
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Readiness"
        '503':
          description: 依赖未就绪
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Readiness"
  "/api/v1/auth/login":
    post:
      tags:
      - auth
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginInput"
      responses:
        '200':
          description: 登录成功；设置 HttpOnly 会话 Cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
  "/api/v1/auth/logout":
    post:
      tags:
      - auth
      operationId: authLogout
      security:
      - cookieAuth: []
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '204':
          description: 会话已销毁
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/v1/auth/session":
    get:
      tags:
      - auth
      operationId: authSession
      security:
      - cookieAuth: []
      responses:
        '200':
          description: 当前会话
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/v1/auth/password":
    post:
      tags:
      - auth
      operationId: authChangePassword
      security:
      - cookieAuth: []
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordChangeInput"
      responses:
        '204':
          description: 密码已更新；其他会话失效
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/profiles":
    get:
      tags:
      - profiles
      operationId: profilesList
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/Cursor"
      - "$ref": "#/components/parameters/Limit"
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - name: group_id
        in: query
        schema:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      - name: tag
        in: query
        schema:
          type: string
          maxLength: 64
      - name: state
        in: query
        schema:
          "$ref": "#/components/schemas/RuntimeState"
      - name: status
        in: query
        schema:
          "$ref": "#/components/schemas/ProfileStatus"
        description: 默认仅返回 active；可显式查询 archived 或 deleted
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name
          - updated_at
          - created_at
          - status
          default: updated_at
      - name: order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: 档案分页
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfilePage"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
      x-required-scope: profiles.read
    post:
      tags:
      - profiles
      operationId: profilesCreate
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfileInput"
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Profile"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
      x-required-scope: profiles.write
  "/api/v1/profiles/{profile_id}":
    parameters:
    - "$ref": "#/components/parameters/ProfileId"
    get:
      tags:
      - profiles
      operationId: profilesGet
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: 档案详情
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Profile"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
      x-required-scope: profiles.read
    patch:
      tags:
      - profiles
      operationId: profilesUpdate
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfilePatch"
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Profile"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
      x-required-scope: profiles.write
    delete:
      tags:
      - profiles
      operationId: profilesDelete
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/CsrfToken"
      - name: permanent
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '204':
          description: 已软删除，或目录与元数据已永久清理。
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/PurgeFailed"
      description: permanent=false：active/archived -> deleted，目录移入 trash；permanent=true：仅对 deleted 档案先移除目录再删行，失败保留行并返回带 deletion_error 的 PROFILE_PURGE_FAILED。
      x-required-scope: profiles.write
  "/api/v1/profiles/{profile_id}/duplicate":
    post:
      tags:
      - profiles
      operationId: profilesDuplicate
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/ProfileId"
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                copy_fingerprint:
                  type: boolean
                  default: false
                copy_proxy:
                  type: boolean
                  default: true
      responses:
        '201':
          description: 副本
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Profile"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
      description: 副本总是分配新 seed；copy_fingerprint=true 只复制其他显式字段。
      x-required-scope: profiles.write
  "/api/v1/profiles/{profile_id}/archive":
    post:
      tags:
      - profiles
      operationId: profilesArchive
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/ProfileId"
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '204':
          description: 已归档
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
      x-required-scope: profiles.write
  "/api/v1/profiles/{profile_id}/restore":
    post:
      tags:
      - profiles
      operationId: profilesRestore
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/ProfileId"
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '204':
          description: archived/deleted -> active；从 trash 恢复目录，清除删除错误。
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
      x-required-scope: profiles.write
  "/api/v1/profiles/import":
    post:
      tags:
      - profiles
      operationId: profilesImport
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfileImportInput"
      responses:
        '201':
          description: 原子导入结果；abort 有任一冲突时不写入。
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileImportResult"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
      x-required-scope: profiles.write
  "/api/v1/profiles/{profile_id}/export":
    post:
      tags:
      - profiles
      operationId: profilesExport
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/ProfileId"
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '200':
          description: 明文仅含脱敏配置；加密容器保护同一脱敏文档。
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileExportEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfileExportRequest"
      x-required-scope: profiles.read
  "/api/v1/profiles/{profile_id}/start":
    post:
      tags:
      - profiles
      operationId: profilesStart
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/ProfileId"
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '202':
          description: 启动已接受
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Runtime"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/Unavailable"
      x-required-scope: runtime.control
  "/api/v1/profiles/{profile_id}/stop":
    post:
      tags:
      - profiles
      operationId: profilesStop
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/ProfileId"
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '202':
          description: 停止已接受
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Runtime"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          "$ref": "#/components/responses/Unavailable"
      x-required-scope: runtime.control
  "/api/v1/profiles/{profile_id}/runtime":
    get:
      tags:
      - profiles
      operationId: profilesRuntime
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/ProfileId"
      responses:
        '200':
          description: 当前运行时
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Runtime"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
      x-required-scope: profiles.read
  "/api/v1/profiles/{profile_id}/viewer":
    post:
      tags:
      - profiles
      operationId: profilesViewer
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/ProfileId"
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '200':
          description: 一次性查看器 URL；之后不可复用
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ViewerSession"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '503':
          "$ref": "#/components/responses/Unavailable"
      x-required-scope: viewer.access
  "/api/v1/groups":
    get:
      tags:
      - groups
      operationId: groupsList
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: 分组列表
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Group"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
      x-required-scope: profiles.read
    post:
      tags:
      - groups
      operationId: groupsCreate
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GroupInput"
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Group"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
      x-required-scope: profiles.write
  "/api/v1/groups/{group_id}":
    parameters:
    - "$ref": "#/components/parameters/GroupId"
    patch:
      tags:
      - groups
      operationId: groupsUpdate
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GroupPatch"
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Group"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
      x-required-scope: profiles.write
    delete:
      tags:
      - groups
      operationId: groupsDelete
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '204':
          description: 已删除；档案 group_id 置空
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
      x-required-scope: profiles.write
  "/api/v1/tags":
    get:
      tags:
      - tags
      operationId: tagsList
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Tag"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
      x-required-scope: profiles.read
    post:
      tags:
      - tags
      operationId: tagsCreate
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TagInput"
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Tag"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
      x-required-scope: profiles.write
  "/api/v1/tags/{tag_id}":
    parameters:
    - "$ref": "#/components/parameters/TagId"
    patch:
      tags:
      - tags
      operationId: tagsUpdate
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TagPatch"
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Tag"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
      x-required-scope: profiles.write
    delete:
      tags:
      - tags
      operationId: tagsDelete
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '204':
          description: 已删除；档案标签关联移除
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
      x-required-scope: profiles.write
  "/api/v1/proxies":
    get:
      tags:
      - proxies
      operationId: proxiesList
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/Cursor"
      - "$ref": "#/components/parameters/Limit"
      - name: kind
        in: query
        schema:
          "$ref": "#/components/schemas/ProxyKind"
      responses:
        '200':
          description: 脱敏代理分页
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProxyPage"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
      x-required-scope: proxies.read
    post:
      tags:
      - proxies
