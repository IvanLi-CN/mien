# Tauri host supply-chain policy. Kept separate because its dependency graph is not the workspace graph.

[graph]
all-features = true

[advisories]
yanked = "warn"
unused-ignored-advisory = "deny"
ignore = [
  # id: RUSTSEC-2026-0009 | package: time 0.3.45 | class: vulnerability
  # reach: Mien uses UTC time and serialization; it does not parse untrusted RFC2822 input；owner: T6
  # 解除条件: time 0.3.47 (requires Rust 1.88; update MSRV under T6)
  "RUSTSEC-2026-0009",
  # id: RUSTSEC-2026-0194 | package: quick-xml 0.38.4 (via plist 1.8.0) | class: vulnerability
  # reach: Tauri reads the app's own Info.plist during packaging; it does not parse untrusted XML；owner: T6
  # 解除条件: plist 1.10.4 + quick-xml 0.42.0 (requires Rust 1.88; update MSRV under T6)
  "RUSTSEC-2026-0194",
  # id: RUSTSEC-2026-0195 | package: quick-xml 0.38.4 (via plist 1.8.0) | class: vulnerability
  # reach: Tauri reads the app's own Info.plist during packaging; it does not parse untrusted XML；owner: T6
  # 解除条件: plist 1.10.4 + quick-xml 0.42.0 (requires Rust 1.88; update MSRV under T6)
  "RUSTSEC-2026-0195",
  # id: RUSTSEC-2024-0370 | package: proc-macro-error 1.0.4 | class: unmaintained
  # reach: Tauri's GTK proc-macro dependency tree; compile-time dependency only；owner: T6
  # 解除条件: no patched version; no MSRV impact; T6 to remove or replace the Tauri GTK dependency path
  "RUSTSEC-2024-0370",
  # id: RUSTSEC-2025-0075 | package: unic-char-range 0.9.0 | class: unmaintained
  # reach: Tauri urlpattern dependency tree; compile-time URL pattern support only；owner: T6
  # 解除条件: no patched version; no MSRV impact; T6 to remove the upstream unic path when Tauri updates
  "RUSTSEC-2025-0075",
  # id: RUSTSEC-2025-0080 | package: unic-common 0.9.0 | class: unmaintained
  # reach: Tauri urlpattern dependency tree; compile-time URL pattern support only；owner: T6
  # 解除条件: no patched version; no MSRV impact; T6 to remove the upstream unic path when Tauri updates
  "RUSTSEC-2025-0080",
  # id: RUSTSEC-2025-0081 | package: unic-char-property 0.9.0 | class: unmaintained
  # reach: Tauri urlpattern dependency tree; compile-time URL pattern support only；owner: T6
  # 解除条件: no patched version; no MSRV impact; T6 to remove the upstream unic path when Tauri updates
  "RUSTSEC-2025-0081",
  # id: RUSTSEC-2025-0098 | package: unic-ucd-version 0.9.0 | class: unmaintained
  # reach: Tauri urlpattern dependency tree; compile-time URL pattern support only；owner: T6
  # 解除条件: no patched version; no MSRV impact; T6 to remove the upstream unic path when Tauri updates
  "RUSTSEC-2025-0098",
  # id: RUSTSEC-2025-0100 | package: unic-ucd-ident 0.9.0 | class: unmaintained
  # reach: Tauri urlpattern dependency tree; compile-time URL pattern support only；owner: T6
  # 解除条件: no patched version; no MSRV impact; T6 to remove the upstream unic path when Tauri updates
  "RUSTSEC-2025-0100",
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
