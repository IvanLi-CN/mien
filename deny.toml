# 许可与供应链门禁，依据 docs/TECH-STACK.md §5。
# 链接依赖只允许宽松许可；Cargo.lock 中的具体版本由审计跟进。

[graph]
all-features = true

[advisories]
yanked = "warn"
unused-ignored-advisory = "deny"
ignore = [
  # id: RUSTSEC-2026-0459 | package: libsqlite3-sys 0.30.1 | class: vulnerability
  # reach: 只影响打开攻击者构造的 db + 同页大小的 -wal 对；Mien 只打开自身 data root 下由自己创建的库，导入走 JSON 不导入 SQLite 文件；owner: T6
  # 解除条件: sqlx 升到带 libsqlite3-sys >= 0.39 的版本（需 MSRV 1.88+，sqlx 0.9 更需 1.94）；或改为链接系统 SQLite（放弃 bundled 可复现性）。发布阻断项。
  "RUSTSEC-2026-0459",
]

# TECH-STACK.md §5 explicitly permits Unicode-3.0; Apache-2.0 WITH LLVM-exception is Apache-derived.
[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
