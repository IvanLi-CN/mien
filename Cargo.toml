[workspace]
resolver = "3"

members = ["crates/mien-core", "crates/mien-server", "xtask"]
exclude = ["src-tauri", "dist"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
mien-core = { path = "crates/mien-core" }

aes-gcm = "0.10"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hkdf = "0.12"
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tauri = "2"
tauri-build = "2"

thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "time", "signal", "io-util", "sync"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
zeroize = { version = "1", features = ["derive"] }
