# 未完成：不得作为发布入口
#
# This is intentionally only a workflow shape. It does not build, sign, reserve,
# upload, promote, tag, or publish anything.
name: Release (skeleton - disabled boundary)

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: "Required release target: patch, minor, major, or X.Y.Z"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-target:
    name: resolve-target (placeholder)
    runs-on: ubuntu-latest
    steps:
      - name: UNFINISHED - do not use as a release entry point
        run: |
          echo "Skeleton only: resolve-target is not implemented."
          echo "No release, tag, reservation, or artifact operation is performed."
          exit 1

  reserve:
    name: reserve (placeholder)
    needs: [resolve-target]
    runs-on: ubuntu-latest
    steps:
      - name: UNFINISHED - do not use as a release entry point
        run: |
          echo "Skeleton only: reserve is not implemented."
          exit 1
  # GATE-001 调用点。尚无 release-gate.json，因此本 job 现在必然失败：这是预期的
  # fail-closed 边界，不是遗漏。报告缺失、缺 ID 或证据不足都会非零退出；这里不提供
  # 任何 skip 分支，也不读 GitHub API。
  gate-release:
    name: gate-release (GATE-001)
    needs: [reserve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: GATE-001 (no report yet, fails closed)
        run: cargo run -q -p xtask -- release-gate --check release-gate.json --report gate-release-report.json
      - name: Upload gate conclusion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-release-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-release-report.json
          if-no-files-found: ignore
