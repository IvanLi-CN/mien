name: CI PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    name: lint
    uses: ./.github/workflows/ci-reusable.yml
    with:
      job: lint
  rust:
    name: rust
    uses: ./.github/workflows/ci-reusable.yml
    with:
      job: rust
  web:
    name: web
    uses: ./.github/workflows/ci-reusable.yml
    with:
      job: web
  contracts:
    name: contracts
    uses: ./.github/workflows/ci-reusable.yml
    with:
      job: contracts
  integration:
    name: integration
    needs: [lint, rust, web, contracts]
    uses: ./.github/workflows/ci-reusable.yml
    with:
      job: integration
  e2e-smoke:
    name: e2e smoke
    needs: [integration]
    uses: ./.github/workflows/ci-reusable.yml
    with:
      job: e2e-smoke
  required:
    name: required
    if: always()
    needs: [lint, rust, web, contracts, integration, e2e-smoke]
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Reject any unsuccessful or skipped validation
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" | jq -e 'length == 6 and all(.[]; .result == "success")' >/dev/null || {
            echo 'One or more validation jobs failed, were cancelled, or were unexpectedly skipped.'
            printf '%s\n' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
            exit 1
          }
          if ! printf '%s' "$NEEDS_JSON" | jq -e 'keys | sort == ["contracts", "e2e-smoke", "integration", "lint", "rust", "web"]' >/dev/null; then
            echo 'Unexpected validation set in needs aggregation.'
            exit 1
          fi
