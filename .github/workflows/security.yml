name: Security
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
concurrency:
  group: security
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Audit Bun dependencies
        run: bun audit
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - name: Audit Rust dependencies (skip until workspace exists)
        shell: bash
        run: |
          if [[ -f Cargo.lock ]]; then cargo install cargo-audit@0.23.0 --locked && cargo audit; else echo 'SKIP cargo audit: Cargo.lock not present (T2 scaffold pending)'; fi
      - name: Scan container dependencies (skip until Dockerfile exists)
        if: hashFiles('deploy/docker/Dockerfile') != ''
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: deploy/docker/Dockerfile
          severity: HIGH,CRITICAL
          exit-code: "1"
