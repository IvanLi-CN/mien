name: CI Main
on:
  push:
    branches: [main]
concurrency:
  group: ci-main
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    name: verify
    uses: ./.github/workflows/ci-reusable.yml
    with:
      full-e2e: true
  package-smoke:
    runs-on: ubuntu-latest
    needs: [verify]
    continue-on-error: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Container and packaging smoke
        shell: bash
        run: |
          if [[ -f deploy/docker/Dockerfile ]]; then docker build --platform linux/amd64 -f deploy/docker/Dockerfile -t mien:main .; else echo 'SKIP packaging smoke: deploy/docker/Dockerfile not present (T3 container scaffold pending)'; fi
